<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Te Amo Gisselle - Bajo las Estrellas</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #020208;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Great Vibes', cursive;
      color: #ffffff;
      cursor: pointer;
    }

    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Botón de Música */
    .music-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
      padding: 8px 18px;
      background: rgba(255, 105, 180, 0.2);
      border: 1px solid rgba(255, 105, 180, 0.5);
      color: #ffffff;
      border-radius: 30px;
      font-family: sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
    }

    .music-btn:hover {
      background: rgba(255, 105, 180, 0.4);
      box-shadow: 0 0 15px rgba(255, 105, 180, 0.6);
    }
  </style>
</head>
<body>

  <!-- Audio local -->
  <audio id="bgAudio" loop preload="auto">
    <source src="heaven.mp3" type="audio/mpeg">
  </audio>

  <button class="music-btn" id="musicBtn" onclick="toggleMusic(event)">🎵 Activar Música (Heaven)</button>

  <div class="container">
    <canvas id="canvas"></canvas>
  </div>

  <script>
    const audio = document.getElementById('bgAudio');
    const musicBtn = document.getElementById('musicBtn');
    let isMusicPlaying = false;

    function playAudio() {
      if (!isMusicPlaying) {
        audio.play().then(() => {
          isMusicPlaying = true;
          musicBtn.innerHTML = '⏸️ Pausar Música';
        }).catch(() => {});
      }
    }

    function toggleMusic(e) {
      if (e) e.stopPropagation();
      if (audio.paused) {
        audio.play();
        isMusicPlaying = true;
        musicBtn.innerHTML = '⏸️ Pausar Música';
      } else {
        audio.pause();
        isMusicPlaying = false;
        musicBtn.innerHTML = '🎵 Reproducir Música';
      }
    }

    document.body.addEventListener('click', playAudio, { once: true });

    // CANVAS Y ESCENA
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width, height, groundY;
    let stars = [];
    let shootingStars = [];
    let fireworks = [];
    let particles = [];
    let textParticles = [];
    let grassBladesBack = [];
    let grassBladesFront = [];
    let windTime = 0;

    let textLaunched1 = false;
    let textLaunched2 = false;
    let textLaunched3 = false;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      groundY = height * 0.80; // 80% cielo, 20% terreno

      // Estrellas
      stars = [];
      for (let i = 0; i < 220; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * (groundY - 15),
          radius: Math.random() * 1.5 + 0.5,
          alpha: Math.random(),
          speed: Math.random() * 0.02 + 0.005
        });
      }

      // Césped denso capa trasera
      grassBladesBack = [];
      for (let x = -10; x <= width + 10; x += 2.2) {
        grassBladesBack.push({
          x: x + (Math.random() - 0.5) * 3,
          baseY: groundY + Math.random() * 8,
          height: Math.random() * 30 + 20,
          offset: Math.random() * Math.PI * 2
        });
      }

      // Césped frente a la pareja para enterrar la base
      grassBladesFront = [];
      for (let x = -10; x <= width + 10; x += 1.8) {
        grassBladesFront.push({
          x: x + (Math.random() - 0.5) * 3,
          baseY: groundY + 15 + Math.random() * 15,
          height: Math.random() * 35 + 25,
          offset: Math.random() * Math.PI * 2
        });
      }
    }

    window.addEventListener('resize', resize);

    // FUEGOS ARTIFICIALES GENERALES
    class Firework {
      constructor(x, targetY) {
        this.x = x;
        this.y = groundY;
        this.targetY = targetY;
        this.speed = Math.random() * 3 + 7;
        this.angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.2;
        this.vx = Math.cos(this.angle) * this.speed;
        this.vy = Math.sin(this.angle) * this.speed;
        this.color = `hsl(${Math.random() * 60 + 330}, 100%, 65%)`;
        this.exploded = false;
      }

      update() {
        if (!this.exploded) {
          this.x += this.vx;
          this.y += this.vy;
          if (this.vy < 0 && this.y <= this.targetY) {
            this.explode();
          }
        }
      }

      explode() {
        this.exploded = true;
        const particleCount = Math.floor(Math.random() * 45 + 55);
        for (let i = 0; i < particleCount; i++) {
          particles.push(new Particle(this.x, this.y, this.color));
        }
      }

      draw() {
        if (!this.exploded) {
          ctx.beginPath();
          ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.shadowBlur = 10;
          ctx.shadowColor = this.color;
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      }
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 1;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.gravity = 0.05;
        this.alpha = 1;
        this.decay = Math.random() * 0.015 + 0.008;
        this.color = color;
      }

      update() {
        this.vx *= 0.98;
        this.vy *= 0.98;
        this.vy += this.gravity;
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
      }

      draw() {
        if (this.alpha <= 0) return;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 1.8, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.alpha;
        ctx.shadowBlur = 8;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
      }
    }

    // FUEGO ARTIFICIAL "Te amo Gisselle" (LETRAS CLARAS, DEFINIDAS Y ATENUADAS)
    function createTextFirework() {
      const offscreen = document.createElement('canvas');
      offscreen.width = width;
      offscreen.height = height;
      const offCtx = offscreen.getContext('2d');

      const fontSize = Math.min(width / 10, 60);
      offCtx.font = `bold ${fontSize}px 'Great Vibes', cursive`;
      offCtx.fillStyle = '#ffffff';
      offCtx.textAlign = 'center';
      offCtx.textBaseline = 'middle';
      const targetY = height * 0.28;
      offCtx.fillText("Te amo Gisselle", width / 2, targetY);

      const imgData = offCtx.getImageData(0, 0, width, height);
      const data = imgData.data;

      textParticles = [];
      // Muestreo limpio para legibilidad tipográfica
      for (let y = 0; y < height; y += 4) {
        for (let x = 0; x < width; x += 4) {
          const index = (y * width + x) * 4;
          if (data[index + 3] > 128) {
            textParticles.push(new TextParticle(x, y));
          }
        }
      }
    }

    class TextParticle {
      constructor(x, y) {
        this.x = x + (Math.random() - 0.5) * 2;
        this.y = y + (Math.random() - 0.5) * 2;
        this.vx = (Math.random() - 0.5) * 0.3;
        this.vy = (Math.random() - 0.5) * 0.3;
        this.gravity = 0;
        this.life = 0;
        this.maxHold = 180; // Exactamente 3 segundos
        this.alpha = 0;     // Fade-in inicial
        this.targetAlpha = 0.7; // Tono tenue y elegante
        this.fadeInSpeed = 0.06;
        this.decay = 0.018;
        this.color = `hsl(${Math.random() * 20 + 340}, 55%, 60%)`;
      }

      update() {
        this.life++;
        if (this.alpha < this.targetAlpha && this.life < this.maxHold) {
          this.alpha += this.fadeInSpeed;
        }

        if (this.life < this.maxHold) {
          this.x += this.vx * 0.05;
          this.y += this.vy * 0.05;
        } else {
          this.gravity += 0.035;
          this.x += this.vx;
          this.y += this.vy + this.gravity;
          this.alpha -= this.decay;
        }
      }

      draw() {
        if (this.alpha <= 0) return;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 1.2, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    // ESTRELLAS FUGACES
    class ShootingStar {
      constructor() {
        this.x = Math.random() * width * 0.8;
        this.y = Math.random() * (groundY * 0.5);
        this.len = Math.random() * 80 + 40;
        this.speed = Math.random() * 6 + 10;
        this.size = Math.random() * 1 + 0.8;
        this.alpha = 1;
      }

      update() {
        this.x += this.speed;
        this.y += this.speed * 0.5;
        this.alpha -= 0.02;
      }

      draw() {
        if (this.alpha <= 0) return;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x - this.len, this.y - this.len * 0.5);
        ctx.strokeStyle = `rgba(255, 255, 255, ${this.alpha})`;
        ctx.lineWidth = this.size;
        ctx.stroke();
      }
    }

    // SILUETAS DE LA PAREJA
    function drawCouple() {
      const cx = width / 2;
      const cy = groundY + 12;

      ctx.save();
      ctx.fillStyle = '#030308';

      // --- CHICA (IZQUIERDA) ---
      ctx.beginPath();
      ctx.arc(cx - 36, cy - 82, 12, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(cx - 34, cy - 72);
      ctx.bezierCurveTo(cx - 54, cy - 60, cx - 56, cy - 35, cx - 48, cy + 2);
      ctx.lineTo(cx - 16, cy + 2);
      ctx.bezierCurveTo(cx - 20, cy - 25, cx - 22, cy - 48, cx - 28, cy - 72);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(cx - 38, cy - 92);
      ctx.bezierCurveTo(cx - 62, cy - 65, cx - 60, cy - 25, cx - 44, cy + 8);
      ctx.bezierCurveTo(cx - 32, cy - 20, cx - 30, cy - 50, cx - 24, cy - 76);
      ctx.closePath();
      ctx.fill();

      // --- CHICO (DERECHA) ---
      ctx.beginPath();
      ctx.arc(cx + 32, cy - 78, 13.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(cx + 27, cy - 70);
      ctx.lineTo(cx + 35, cy - 70);
      ctx.lineTo(cx + 37, cy - 64);
      ctx.lineTo(cx + 25, cy - 64);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(cx + 28, cy - 64);
      ctx.lineTo(cx + 52, cy - 58);
      ctx.bezierCurveTo(cx + 56, cy - 38, cx + 50, cy - 15, cx + 42, cy + 2);
      ctx.lineTo(cx + 10, cy + 2);
      ctx.bezierCurveTo(cx + 16, cy - 25, cx + 20, cy - 48, cx + 22, cy - 64);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(cx + 48, cy - 55);
      ctx.bezierCurveTo(cx + 62, cy - 35, cx + 58, cy - 10, cx + 46, cy + 2);
      ctx.lineTo(cx + 38, cy + 2);
      ctx.bezierCurveTo(cx + 50, cy - 15, cx + 52, cy - 35, cx + 42, cy - 52);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(cx + 18, cy - 88);
      ctx.bezierCurveTo(cx + 32, cy - 94, cx + 48, cy - 82, cx + 41, cy - 70);
      ctx.lineTo(cx + 28, cy - 70);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    // TERRENO Y CÉSPED
    function drawTerrainAndGrassBack(wind) {
      ctx.save();
      
      ctx.fillStyle = '#030a05';
      ctx.fillRect(0, groundY, width, height - groundY);

      ctx.strokeStyle = '#06180d';
      ctx.lineWidth = 2;
      for (let blade of grassBladesBack) {
        ctx.beginPath();
        ctx.moveTo(blade.x, blade.baseY);
        const sway = Math.sin(windTime + blade.offset) * 5 + wind * 7;
        ctx.quadraticCurveTo(blade.x, blade.baseY - blade.height / 2, blade.x + sway, blade.baseY - blade.height);
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawGrassFront(wind) {
      ctx.save();

      ctx.strokeStyle = '#0d381c';
      ctx.lineWidth = 2.2;
      for (let blade of grassBladesFront) {
        ctx.beginPath();
        ctx.moveTo(blade.x, blade.baseY);
        const sway = Math.sin(windTime + blade.offset) * 7 + wind * 10;
        ctx.quadraticCurveTo(blade.x, blade.baseY - blade.height / 2, blade.x + sway, blade.baseY - blade.height);
        ctx.stroke();
      }

      ctx.restore();
    }

    // BUCLE DE ANIMACIÓN
    function animate() {
      // Fondo noche
      const grad = ctx.createLinearGradient(0, 0, 0, height);
      grad.addColorStop(0, '#02020a');
      grad.addColorStop(0.5, '#0a0818');
      grad.addColorStop(0.80, '#060d09');
      grad.addColorStop(1, '#020503');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      // Estrellas
      ctx.fillStyle = '#ffffff';
      for (let star of stars) {
        star.alpha += star.speed;
        if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
        ctx.globalAlpha = Math.abs(star.alpha);
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // Estrellas fugaces
      if (Math.random() < 0.015) {
        shootingStars.push(new ShootingStar());
      }

      for (let i = shootingStars.length - 1; i >= 0; i--) {
        const ss = shootingStars[i];
        ss.update();
        ss.draw();
        if (ss.alpha <= 0) shootingStars.splice(i, 1);
      }

      windTime += 0.03;
      const wind = Math.sin(windTime) * 0.8;

      const currentTime = audio.currentTime;

      // ZONAS DE FUEGOS ARTIFICIALES GENERALES
      // Ciclo 1: 0:46 ➔ 1:06 (46s a 66s)
      // Ciclo 2: 1:53 ➔ 2:14 (113s a 134s)
      // Ciclo 3: 3:04 ➔ 3:26 (184s a 206s)
      const inFireworkZone1 = currentTime >= 46 && currentTime <= 66;
      const inFireworkZone2 = currentTime >= 113 && currentTime <= 134;
      const inFireworkZone3 = currentTime >= 184 && currentTime <= 206;

      if (inFireworkZone1 || inFireworkZone2 || inFireworkZone3) {
        if (Math.random() < 0.22) {
          fireworks.push(new Firework(Math.random() * (width * 0.8) + width * 0.1, Math.random() * (groundY * 0.5) + 50));
        }
      }

      // LANZAMIENTO DEL NOMBRE "Te amo Gisselle"
      // Momento 1: 1:10 (70s)
      // Momento 2: 2:16 (136s)
      // Momento 3: 3:36 (216s)
      if (currentTime >= 70 && !textLaunched1) {
        textLaunched1 = true;
        createTextFirework();
      } else if (currentTime < 70) {
        textLaunched1 = false;
      }

      if (currentTime >= 136 && !textLaunched2) {
        textLaunched2 = true;
        createTextFirework();
      } else if (currentTime < 136 && currentTime > 110) {
        textLaunched2 = false;
      }

      if (currentTime >= 216 && !textLaunched3) {
        textLaunched3 = true;
        createTextFirework();
      } else if (currentTime < 216 && currentTime > 180) {
        textLaunched3 = false;
      }

      // Actualizaciones
      for (let i = fireworks.length - 1; i >= 0; i--) {
        const fw = fireworks[i];
        fw.update();
        fw.draw();
        if (fw.exploded) fireworks.splice(i, 1);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw();
        if (p.alpha <= 0) particles.splice(i, 1);
      }

      for (let i = textParticles.length - 1; i >= 0; i--) {
        const tp = textParticles[i];
        tp.update();
        tp.draw();
        if (tp.alpha <= 0) textParticles.splice(i, 1);
      }

      // CAPAS DE RENDERIZADO
      drawTerrainAndGrassBack(wind);
      drawCouple();
      drawGrassFront(wind);

      requestAnimationFrame(animate);
    }

    resize();
    animate();
  </script>
</body>
</html>
